name: Deploy Lion Cub Web Debug

on:
  repository_dispatch:
    types: ["lion-cub-source-updated"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Web Debug repository
        uses: actions/checkout@v5

      - name: Checkout private Lion Cub source
        uses: actions/checkout@v5
        with:
          repository: lequanglong1989/lion-cub-source
          ref: main
          path: lion-cub-source
          token: ${{ secrets.LION_CUB_CI_TOKEN }}

      - name: Export Web Debug with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: lion-cub-source/
          presets_to_export: Web Debug
          export_debug: true
          cache: true

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          WEB_DIR="$(find "$BUILD_DIR" -maxdepth 2 -type f -name 'index.html' -printf '%h\n' | head -n 1)"
          if [ -z "$WEB_DIR" ]; then
            echo "Web export index.html not found under $BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 3 -type f | sort | head -n 200 || true
            exit 1
          fi
          cp -a "$WEB_DIR"/. site/
          touch site/.nojekyll
          echo "Prepared Web build from $WEB_DIR"
          find site -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Write build info
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          {
            echo "# Lion Cub Web Debug"
            echo
            echo "- Source repository: `lequanglong1989/lion-cub-source`"
            echo "- Source commit: ${SOURCE_SHA:-manual}"
            echo "- Godot: 4.7.2"
            echo "- Web preset: Web Debug"
          } > site/BUILD_INFO.md

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
